name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Run Bandit
        run: bandit -r app

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

  deploy-qa:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to QA
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_QA }}"

  deploy-prd:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to PRD
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRD }}"